name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # On the job rather than the workflow, so the scope is stated where it is used.
    permissions:
      contents: write
    steps:
      # Pinned to a commit rather than a tag. A tag moves, and a moving third-party action is an
      # unpinned dependency with write access to the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A tag does not run CI, so a release built from a branch that never reached main would
      # otherwise publish unchecked. These are the same checks, run here rather than trusted.
      - name: Install
        run: npm ci

      - name: Formatting and types
        run: |
          npx prettier --check startos
          npx tsc --noEmit

      - name: The wallet's signing key is the one we vendored
        run: |
          set -euo pipefail
          gpg --show-keys --with-colons keys/privkeyio-signing-key.asc \
            | awk -F: '/^fpr:/ {print $10; exit}' > /tmp/fpr
          echo "A47D99B6DB0D715D40C59A2023AE8A8EA7E24E38" | diff -u - /tmp/fpr

      - name: Guard against infra leakage
        run: |
          if git grep -nIE '192\.168\.[0-9]|(^|[^0-9.])10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|/home/|/data/|[a-z2-7]{16,56}\.onion' -- . ':!.github/workflows/ci.yml'; then
            echo "Internal infrastructure reference found; see above."
            exit 1
          fi

      # The same action CI runs, so a release cannot be built by a path that has never been
      # exercised. This job previously did none of it: no start-cli, no workspace, no buildx driver
      # and no squashfs tools, so the first tag would have produced a red release rather than a
      # signed one.
      - uses: ./.github/actions/build-s9pk
        with:
          s9pk-build-key: ${{ secrets.S9PK_BUILD_KEY }}

      - name: Checksums
        run: sha256sum *.s9pk > SHA256SUMS

      - name: Sign the checksums with the release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Signs SHA256SUMS rather than each artifact: one signature covers every file listed, and a
        # verifier checks the signature once and then the hashes. The private key here is the signing
        # subkey only. The primary key certifies and never leaves the machine that made it, so a
        # compromised runner costs a subkey rather than the identity.
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS
          # Prove the signature verifies before publishing it, rather than finding out from a user.
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      - name: Verify against the published key
        # The check above runs in the keyring that just imported the signing key, so it would pass
        # even if the key committed to this repo were a different or outdated one. This one imports
        # only the published key into an empty keyring, which is exactly what a user does. A release
        # that cannot be verified with the key we publish is worse than no release: it teaches
        # people the check is noise.
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import keys/twentyonelife-release.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            *.s9pk
            SHA256SUMS
            SHA256SUMS.asc
