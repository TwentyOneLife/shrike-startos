name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by declaration rather than by the repository's current default, which is one
# settings change away from being something else.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit rather than a tag, since a tag moves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Formatting
        run: npx prettier --check startos

      - name: Types
        run: npx tsc --noEmit

      - name: The wallet's signing key is the one we vendored
        # The image verifies Shrike's release against this key. If the file ever changes, that is a
        # change of publisher and has to be a visible one, so the fingerprint is pinned here too.
        run: |
          set -euo pipefail
          gpg --show-keys --with-colons keys/privkeyio-signing-key.asc \
            | awk -F: '/^fpr:/ {print $10; exit}' > /tmp/fpr
          echo "A47D99B6DB0D715D40C59A2023AE8A8EA7E24E38" | diff -u - /tmp/fpr
          echo "signing key unchanged"

  build-s9pk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: ./.github/actions/build-s9pk
        with:
          s9pk-build-key: ${{ secrets.S9PK_BUILD_KEY }}
          # A pull request may build without a key, so a fork's or Dependabot's build still proves
          # the package packs. Nothing else may: see the action's input.
          allow-throwaway-key: ${{ github.event_name == 'pull_request' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Named for what it is: a build that may carry a throwaway signature, which must never be
          # installed in the belief that it is a release.
          name: s9pk-unsigned-ci
          path: '*.s9pk'
          if-no-files-found: error

  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Guard against infra leakage
        run: |
          if git grep -nIE '192\.168\.[0-9]|(^|[^0-9.])10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|/home/|/data/|[a-z2-7]{16,56}\.onion' -- . ':!.github/workflows/'; then
            echo "Internal infrastructure reference found; see above."
            exit 1
          fi
          echo "no internal refs"
